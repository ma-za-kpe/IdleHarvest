<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Background circle -->
  <circle cx="16" cy="16" r="16" fill="#0A7C6B"/>
  
  <!-- Phone outline -->
  <rect x="10" y="6" width="12" height="20" rx="2" ry="2" fill="none" stroke="#FFFFFF" stroke-width="1.5"/>
  
  <!-- Wheat stem -->
  <line x1="16" y1="11" x2="16" y2="22" stroke="#FFB300" stroke-width="1.2"/>
  
  <!-- Wheat grains left -->
  <path d="M16,14 C14.5,12.5 13.8,11 14.5,9.8 C15.3,11 15.3,12.5 16,14" fill="#FFB300"/>
  <path d="M16,18 C14.5,16.5 13.8,15 14.5,13.8 C15.3,15 15.3,16.5 16,18" fill="#FFB300"/>
  
  <!-- Wheat grains right -->
  <path d="M16,14 C17.5,12.5 18.2,11 17.5,9.8 C16.7,11 16.7,12.5 16,14" fill="#FFB300"/>
  <path d="M16,18 C17.5,16.5 18.2,15 17.5,13.8 C16.7,15 16.7,16.5 16,18" fill="#FFB300"/>
  
  <!-- Top grain -->
  <path d="M16,11 C15.3,9.8 15.3,8.5 16,7.5 C16.7,8.5 16.7,9.8 16,11" fill="#FFB300"/>
  
  <!-- Phone home indicator -->
  <rect x="14" y="24" width="4" height="0.8" rx="0.4" fill="#FFFFFF" opacity="0.5"/>
</svg>
