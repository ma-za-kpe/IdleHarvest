name: Firebase App Distribution

on:
  push:
    branches: [main, release/**]
  workflow_dispatch:

jobs:
  distribute-android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', '**/libs.versions.toml') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Build Android debug APK
        run: ./gradlew :androidApp:assembleDebug --stacktrace

      - name: Set release metadata
        id: meta
        run: |
          echo "version_name=$(./gradlew -q :androidApp:printVersionName 2>/dev/null || echo '1.0.0')" >> $GITHUB_OUTPUT
          echo "commit_sha=${GITHUB_SHA::8}" >> $GITHUB_OUTPUT
          echo "build_timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_OUTPUT

      - name: Upload to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_ANDROID_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          groups: internal-testers
          file: androidApp/build/outputs/apk/debug/androidApp-debug.apk
          releaseNotes: |
            Version: ${{ steps.meta.outputs.version_name }}
            Commit: ${{ steps.meta.outputs.commit_sha }}
            Built: ${{ steps.meta.outputs.build_timestamp }}
            Branch: ${{ github.ref_name }}
        continue-on-error: true
        id: upload_attempt_1

      - name: Retry upload (attempt 2)
        if: steps.upload_attempt_1.outcome == 'failure'
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_ANDROID_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          groups: internal-testers
          file: androidApp/build/outputs/apk/debug/androidApp-debug.apk
          releaseNotes: |
            Version: ${{ steps.meta.outputs.version_name }}
            Commit: ${{ steps.meta.outputs.commit_sha }}
            Built: ${{ steps.meta.outputs.build_timestamp }} (retry 2)
        continue-on-error: true
        id: upload_attempt_2

      - name: Retry upload (attempt 3 — final)
        if: steps.upload_attempt_2.outcome == 'failure'
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_ANDROID_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          groups: internal-testers
          file: androidApp/build/outputs/apk/debug/androidApp-debug.apk
          releaseNotes: |
            Version: ${{ steps.meta.outputs.version_name }}
            Commit: ${{ steps.meta.outputs.commit_sha }}
            Built: ${{ steps.meta.outputs.build_timestamp }} (retry 3)

      - name: Notify on failure
        if: failure()
        run: |
          echo "Firebase App Distribution upload failed after 3 attempts."
          echo "Build: ${{ steps.meta.outputs.version_name }} (${{ steps.meta.outputs.commit_sha }})"
          exit 1
