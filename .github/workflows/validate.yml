name: Validation Pipeline

on:
  push:
    branches: [main, feature/**]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', '**/libs.versions.toml') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Check Spotless formatting
        run: ./gradlew spotlessCheck --stacktrace

      - name: Run Detekt static analysis
        run: ./gradlew detekt --stacktrace

      - name: Run Android lint
        run: ./gradlew :androidApp:lintDebug :shared:lintAndroidMain --stacktrace

      - name: Run unit tests
        run: ./gradlew :shared:testAndroidHostTest --stacktrace

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: shared/build/test-results/testAndroidHostTest/

      - name: Upload lint results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-results
          path: |
            androidApp/build/reports/lint-results-debug.html
            shared/build/reports/detekt/
